		id="canvas"
		oncontextmenu="event.preventDefault()"

	></canvas>

<style>
	.space-viewer {
		position: relative;
		width: 100%;
		aspect-ratio: 1;
		overflow: hidden;
		background: #000;
	}

	#canvas {
		display: block;
		width: 100%;
		height: 100%;
		outline: none;
		/* Touch gestures (pinch to zoom, drag to rotate) are handled by the visualization, not the page */
		touch-action: none;
	}

	#status {
		position: absolute;
		inset: 0;
		display: flex;
		align-items: center;
		justify-content: center;
		color: #ccc;
		font: 16px sans-serif;
		pointer-events: none;
	}
</style>

<script>
	var statusElement = document.getElementById("status");

	var Module = {
		canvas: document.getElementById("canvas"),

		locateFile: function (path) {
			return "space/" + path;
		},

		setStatus: function (text) {
			// Emscripten reports download progress in bytes, but we should display the progress + mb value. Bytes don't mean much to a user lol
			var progress = text.match(/\((\d+)\/(\d+)\)/);

			if (progress && Number(progress[2]) > 0) {
				// Progress is cacked since it doesn't give us the uncompressed size. Ignoring the download percentage for now as the files are small enough that it likely wont matter.
				var loaded = Number(progress[1]);
				var total = Number(progress[2]);
				var toMB = function (bytes) {
					return (bytes / 1000000).toFixed(1);
				};
				text = "Loading satellite data... ";
			}

			statusElement.textContent = text;
			statusElement.style.display = text ? "flex" : "none";
		},
		print: function (text) {
			console.log(text);
		},
		printErr: function (text) {
			console.error(text);
		},
	};

	window.addEventListener("error", function () {
		statusElement.textContent =
			"An error occurred, see the console for details.";
		statusElement.style.display = "flex";
	});
</script>

<script>
// Set copyright year
document.getElementById("year").textContent = new Date().getFullYear();

// Dark mode
function checkIfDarkMode() {
let stored = localStorage.getItem("darkTheme");
if (stored === null) {
const prefersDark = window.matchMedia(
  "(prefers-color-scheme: dark)",
).matches;
localStorage.setItem("darkTheme", prefersDark);
return prefersDark;
}
return stored === "true";
}

// Pause all videos on focus loss
document.addEventListener("blur", function () {
  const elements = document.getElementsByTagName("video");
  for (const element of elements) {
    element.pause();
  }
  console.log("Pausing videos")
});

// Play all videos when focus is returned
document.addEventListener("focus", function () {
  const elements = document.getElementsByTagName("video");
  for (const element of elements) {
    element.play();
  }
  console.log("Playing videos")
});

function applyDarkMode(isDark) {
document.body.classList.toggle("darkMode", isDark);
localStorage.setItem("darkTheme", isDark);
}

function toggleDarkMode() {
const current = document.body.classList.contains("darkMode");
applyDarkMode(!current);
}

// Apply on load
applyDarkMode(checkIfDarkMode());
</script>
